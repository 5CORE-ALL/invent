name: TikTok GMV Max spend sync

# TikTok blocks the production server's IP (India) for the GMV Max report, so this job
# runs on GitHub's runner (US), fetches spend per product and POSTs it to the app,
# which stores it and applies it to tiktok_gmv_ads. The repo is PUBLIC: this job must
# never print tokens or business data - it only reports counts as annotations.
on:
  schedule:
    - cron: '30 3,15 * * *'
  workflow_dispatch:

concurrency:
  group: tiktok-gmv-max-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TT_TOKEN: ${{ secrets.TIKTOK_ADS_ACCESS_TOKEN }}
      TT_ADV: ${{ secrets.TIKTOK_ADS_ADVERTISER_ID }}
      TT_STORE: ${{ secrets.TIKTOK_SHOP_ID }}
      INGEST_KEY: ${{ secrets.TIKTOK_GMV_INGEST_KEY }}
      INGEST_URL: https://inventory.5coremanagement.com/api/tiktok-gmv-max/ingest
    steps:
      - name: Check secrets
        run: |
          for v in TT_TOKEN TT_ADV TT_STORE INGEST_KEY; do
            if [ -z "${!v}" ]; then echo "::error title=missing secret::$v is not set"; exit 1; fi
          done

      - name: Fetch GMV Max spend and upload
        run: |
          set -uo pipefail
          # Pasted secrets often carry a trailing newline/space; strip all whitespace.
          TT_TOKEN=$(printf '%s' "$TT_TOKEN" | tr -d '[:space:]')
          TT_ADV=$(printf '%s' "$TT_ADV" | tr -d '[:space:]')
          TT_STORE=$(printf '%s' "$TT_STORE" | tr -d '[:space:]')
          INGEST_KEY=$(printf '%s' "$INGEST_KEY" | tr -d '[:space:]')
          # Same windows as the app (America/Los_Angeles): L30 = 30 days ago..yesterday, L1 = yesterday.
          YESTERDAY=$(TZ=America/Los_Angeles date -d 'yesterday' +%F)
          D30=$(TZ=America/Los_Angeles date -d '30 days ago' +%F)
          summary=""

          fetch_range() {
            local range="$1" start="$2" end="$3" metrics storefmt combo page=1 total=1 ok=0 err=""
            # Try store_ids as ["id"] first, then [id]; and both metric name sets.
            for combo in 'q|["cost","orders","gross_revenue"]' 'q|["gmv_max_cost","gmv_max_orders","gmv_max_gross_revenue"]' \
                         'n|["cost","orders","gross_revenue"]' 'n|["gmv_max_cost","gmv_max_orders","gmv_max_gross_revenue"]'; do
              metrics="${combo#*|}"
              if [ "${combo%%|*}" = "q" ]; then storefmt="[\"$TT_STORE\"]"; else storefmt="[$TT_STORE]"; fi
              : > "rows_$range.ndjson"; page=1; total=1; ok=1
              while [ "$page" -le "$total" ] && [ "$page" -le 40 ]; do
                http=$(curl -sS -m 60 -o resp.json -w '%{http_code}' -G \
                  'https://business-api.tiktok.com/open_api/v1.3/gmv_max/report/get/' \
                  -H "Access-Token: $TT_TOKEN" \
                  --data-urlencode "advertiser_id=$TT_ADV" \
                  --data-urlencode "store_ids=$storefmt" \
                  --data-urlencode 'dimensions=["item_id"]' \
                  --data-urlencode "metrics=$metrics" \
                  --data-urlencode "start_date=$start" \
                  --data-urlencode "end_date=$end" \
                  --data-urlencode "page=$page" \
                  --data-urlencode 'page_size=100') || { ok=0; err="curl failed"; break; }
                code=$(jq -r '.code // -1' resp.json 2>/dev/null || echo -1)
                if [ "$http" != "200" ] || [ "$code" != "0" ]; then
                  ok=0; err="http=$http tiktok_code=$code $(jq -r '.message // ""' resp.json 2>/dev/null | head -c 220)"; break
                fi
                jq -c '(.data.list // .data.report_list // [])[] |
                  {id: ((.dimensions.item_id // .dimensions.item_group_id // .item_id // "") | tostring),
                   cost: ((.metrics.cost // .metrics.gmv_max_cost // .metrics.net_cost // .metrics.gmv_max_net_cost // 0)
                          | if type=="object" then (.amount // .value // 0) else . end | tonumber? // 0)}' \
                  resp.json >> "rows_$range.ndjson"
                total=$(jq -r '(.data.page_info.total_page // .data.page_info.total_pages // 1)' resp.json)
                page=$((page+1))
              done
              [ "$ok" = "1" ] && break
            done
            if [ "$ok" != "1" ]; then
              echo "::error title=GMV Max $range::TikTok request failed: $err"; return 1
            fi
            jq -s '[.[] | select(.id != "" and .cost > 0)] | group_by(.id) | map({key: .[0].id, value: (map(.cost) | add)}) | from_entries' \
              "rows_$range.ndjson" > "map_$range.json"
            jq -n --arg r "$range" --slurpfile m "map_$range.json" '{range: $r, rows: $m[0]}' > "payload_$range.json"
            local n; n=$(jq 'length' "map_$range.json")
            local up
            up=$(curl -sS -m 120 -X POST "$INGEST_URL" \
                  -H "X-Ingest-Key: $INGEST_KEY" -H 'Content-Type: application/json' \
                  -H 'Accept: application/json' --data @"payload_$range.json" \
                  -w ' http=%{http_code}')
            summary="$summary | $range items_with_spend=$n upload: $(echo "$up" | head -c 220)"
          }

          rc=0
          fetch_range L30 "$D30" "$YESTERDAY" || rc=1
          fetch_range L1 "$YESTERDAY" "$YESTERDAY" || rc=1
          echo "::notice title=GMV Max sync::window $D30..$YESTERDAY $summary"
          exit $rc
