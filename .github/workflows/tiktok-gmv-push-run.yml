name: TikTok GMV Max budget push

# Applies budget changes queued in the app to TikTok. TikTok blocks the production server's IP
# (India), so the app only records the change; this job (US runner) fetches the pending changes,
# writes them through the Marketing API and reports the result back.
# The repo is PUBLIC: never print tokens, campaign names or amounts - counts only.
on:
  push:
    branches: [tiktok-gmv-test]

concurrency:
  group: tiktok-gmv-max-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TT_TOKEN: ${{ secrets.TIKTOK_ADS_ACCESS_TOKEN }}
      TT_ADV: ${{ secrets.TIKTOK_ADS_ADVERTISER_ID }}
      INGEST_KEY: ${{ secrets.TIKTOK_GMV_INGEST_KEY }}
      APP_URL: https://inventory.5coremanagement.com/api/tiktok-gmv-max/push
    steps:
      - name: Push pending budget changes
        run: |
          set +e
          TT_TOKEN=$(printf '%s' "$TT_TOKEN" | tr -d '[:space:]')
          TT_ADV=$(printf '%s' "$TT_ADV" | tr -d '[:space:]')
          INGEST_KEY=$(printf '%s' "$INGEST_KEY" | tr -d '[:space:]')
          B=https://business-api.tiktok.com/open_api/v1.3
          if [ -z "$TT_TOKEN" ] || [ -z "$TT_ADV" ] || [ -z "$INGEST_KEY" ]; then
            echo "::error title=GMV Max push::a required secret is missing"; exit 1
          fi

          http=$(curl -sS -m 60 -o pending.json -w '%{http_code}' -X POST "$APP_URL/pending" \
            -H "X-Ingest-Key: $INGEST_KEY" -H 'Accept: application/json')
          if [ "$http" != "200" ]; then echo "::error title=GMV Max push::pending http=$http"; exit 1; fi
          n=$(jq '.jobs | length' pending.json 2>/dev/null || echo 0)
          if [ "${n:-0}" -eq 0 ]; then echo "nothing to push"; exit 0; fi

          ok=0; failed=0
          while IFS= read -r job; do
            id=$(jq -r '.id' <<<"$job")
            cid=$(jq -r '.campaign_id' <<<"$job")
            action=$(jq -r '.action' <<<"$job")
            budget=$(jq -r '.budget' <<<"$job")
            msg=""; applied=null; success=false

            if [ "$action" != "budget" ]; then
              msg="unsupported action"
            elif ! [[ "$cid" =~ ^[0-9]{5,25}$ ]] || ! [[ "$budget" =~ ^[0-9]+(\.[0-9]{1,2})?$ ]]; then
              msg="invalid campaign id or budget"
            else
              body=$(jq -n --arg a "$TT_ADV" --arg c "$cid" --argjson b "$budget" '{advertiser_id: $a, campaign_id: $c, budget: $b}')
              h=$(curl -sS -m 60 -o upd.json -w '%{http_code}' -X POST "$B/campaign/gmv_max/update/" \
                    -H "Access-Token: $TT_TOKEN" -H 'Content-Type: application/json' --data "$body")
              code=$(jq -r '.code // -1' upd.json 2>/dev/null || echo -1)
              if [ "$h" = "200" ] && [ "$code" = "0" ]; then
                # read the budget back so the app stores what TikTok really has
                curl -sS -m 40 -o inf.json -G "$B/campaign/gmv_max/info/" -H "Access-Token: $TT_TOKEN" \
                  --data-urlencode "advertiser_id=$TT_ADV" --data-urlencode "campaign_id=$cid"
                applied=$(jq -c '(.data.budget // null) | if type=="object" then (.amount // null) else . end' inf.json 2>/dev/null || echo null)
                case "$applied" in ''|*[!0-9.nul]*) applied=null ;; esac
                if [ "$applied" != "null" ] && jq -e -n --argjson a "$applied" --argjson b "$budget" '(($a - $b) | fabs) < 0.005' >/dev/null; then
                  success=true; msg="Applied on TikTok"
                elif [ "$applied" = "null" ]; then
                  success=true; msg="Accepted by TikTok (could not read the budget back)"
                else
                  msg="TikTok accepted the call but the budget is still different"
                fi
              else
                msg="TikTok error code=$code $(jq -r '.message // ""' upd.json 2>/dev/null | head -c 200)"
              fi
            fi

            res=$(jq -n --argjson id "$id" --argjson ok "$success" --arg m "$msg" --argjson b "${applied:-null}" \
                  '{id: $id, ok: $ok, message: $m, budget: $b}')
            curl -sS -m 60 -o /dev/null -X POST "$APP_URL/result" -H "X-Ingest-Key: $INGEST_KEY" \
              -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$res"
            if [ "$success" = true ]; then ok=$((ok+1)); else failed=$((failed+1)); fi
          done < <(jq -c '.jobs[]' pending.json)

          echo "::notice title=GMV Max push::applied=$ok failed=$failed"
          [ "$failed" -eq 0 ]
