name: TikTok GMV Max budget field check (temporary)

# TEMPORARY, test branch only. Prints field NAMES and the budget number of one campaign.
on:
  push:
    branches: [tiktok-gmv-test]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TT_TOKEN: ${{ secrets.TIKTOK_ADS_ACCESS_TOKEN }}
      TT_ADV: ${{ secrets.TIKTOK_ADS_ADVERTISER_ID }}
    steps:
      - name: Check info endpoint
        run: |
          set +e
          TT_TOKEN=$(printf '%s' "$TT_TOKEN" | tr -d '[:space:]')
          TT_ADV=$(printf '%s' "$TT_ADV" | tr -d '[:space:]')
          TT_STORE=$(printf '%s' "$TT_STORE" | tr -d '[:space:]')
          B=https://business-api.tiktok.com/open_api/v1.3
          out=""
          rep() { # $1=label $2=metrics json $3=dims json
            http=$(curl -sS -m 60 -o r.json -w '%{http_code}' -G "$B/gmv_max/report/get/" -H "Access-Token: $TT_TOKEN" \
              --data-urlencode "advertiser_id=$TT_ADV" --data-urlencode "store_ids=[\"$TT_STORE\"]" \
              --data-urlencode "dimensions=$3" --data-urlencode "metrics=$2" \
              --data-urlencode "start_date=$(TZ=Etc/GMT+5 date -d '7 days ago' +%F)" --data-urlencode "end_date=$(TZ=Etc/GMT+5 date +%F)" \
              --data-urlencode 'filtering={"campaign_ids":["1882667097534897"]}' --data-urlencode 'page_size=5')
            out="$out || $1 http=$http code=$(jq -r '.code // "?"' r.json 2>/dev/null) msg=$(jq -r '.message // ""' r.json 2>/dev/null | head -c 700)"
            out="$out | metric_keys=$(jq -r '(.data.list // [])[0].metrics // {} | keys | join("+")' r.json 2>/dev/null | head -c 400)"
          done_dummy=1
          }
          rep 'bogus metric' '["not_a_metric"]' '["campaign_id"]'
          rep 'budget metric' '["cost","budget","daily_budget"]' '["campaign_id"]'
          echo "::notice title=metrics check::$out"
