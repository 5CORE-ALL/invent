name: TikTok GMV Max campaign check (temporary)

# TEMPORARY, test branch only. Prints one campaign's daily numbers; never the token.
on:
  push:
    branches: [tiktok-gmv-test]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TT_TOKEN: ${{ secrets.TIKTOK_ADS_ACCESS_TOKEN }}
      TT_ADV: ${{ secrets.TIKTOK_ADS_ADVERTISER_ID }}
      TT_STORE: ${{ secrets.TIKTOK_SHOP_ID }}
    steps:
      - name: Campaign daily numbers
        run: |
          set -uo pipefail
          TT_TOKEN=$(printf '%s' "$TT_TOKEN" | tr -d '[:space:]')
          TT_ADV=$(printf '%s' "$TT_ADV" | tr -d '[:space:]')
          TT_STORE=$(printf '%s' "$TT_STORE" | tr -d '[:space:]')
          B=https://business-api.tiktok.com/open_api/v1.3
          CID=1882667097534897
          START=$(date -u -d '70 days ago' +%F); END=$(date -u -d 'tomorrow' +%F)
          call() { # $1=dims json, $2=extra metrics json
            curl -sS -m 90 -G "$B/gmv_max/report/get/" -H "Access-Token: $TT_TOKEN" \
              --data-urlencode "advertiser_id=$TT_ADV" --data-urlencode "store_ids=[\"$TT_STORE\"]" \
              --data-urlencode "dimensions=$1" --data-urlencode "metrics=$2" \
              --data-urlencode "start_date=$START" --data-urlencode "end_date=$END" \
              --data-urlencode "filtering={\"campaign_ids\":[\"$CID\"]}" \
              --data-urlencode 'page_size=100'
          }
          out="window=$START..$END"
          call '["campaign_id","stat_time_day"]' '["cost","orders","gross_revenue","roi"]' > d.json
          out="$out || daily code=$(jq -r '.code' d.json) msg=$(jq -r '.message' d.json | head -c 100) rows=$(jq -r '(.data.list // [])|length' d.json)"
          days=$(jq -r '(.data.list // [])[] | "\(.dimensions.stat_time_day|tostring|.[0:10]):\(.metrics.cost)/\(.metrics.orders)/\(.metrics.gross_revenue)"' d.json | sort | tr '\n' ' ')
          out="$out || DAYS(cost/orders/revenue): $days"
          call '["campaign_id"]' '["cost","orders","gross_revenue","roi"]' > c.json
          out="$out || campaign total in window: $(jq -c '(.data.list // [])[0] | .metrics' c.json)"
          echo "::notice title=campaign check::$out"
