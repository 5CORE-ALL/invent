name: TikTok GMV Max budget path check (temporary)

on:
  push:
    branches: [tiktok-gmv-test]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TT_TOKEN: ${{ secrets.TIKTOK_ADS_ACCESS_TOKEN }}
      TT_ADV: ${{ secrets.TIKTOK_ADS_ADVERTISER_ID }}
    steps:
      - name: Probe info paths
        run: |
          set +e
          TT_TOKEN=$(printf '%s' "$TT_TOKEN" | tr -d '[:space:]')
          TT_ADV=$(printf '%s' "$TT_ADV" | tr -d '[:space:]')
          B=https://business-api.tiktok.com/open_api/v1.3
          out=""
          for path in campaign/gmv_max/info gmv_max/campaign/info campaign/gmv_max/get; do
            http=$(curl -sS -m 40 -o i.json -w '%{http_code}' -G "$B/$path/" -H "Access-Token: $TT_TOKEN" \
              --data-urlencode "advertiser_id=$TT_ADV" --data-urlencode 'campaign_id=1882667097534897')
            out="$out || $path http=$http code=$(jq -r '.code // "?"' i.json 2>/dev/null) msg=$(jq -r '.message // ""' i.json 2>/dev/null | head -c 150)"
            out="$out | paths=$(jq -r '[paths(scalars) | map(tostring) | join(".")] | .[0:70] | join(",")' i.json 2>/dev/null | head -c 900)"
            out="$out | budget=$(jq -c '[.. | objects | to_entries[] | select(.key|test("budget";"i")) | {(.key): .value}]' i.json 2>/dev/null | head -c 250)"
          done
          echo "::notice title=info probe::$out"
