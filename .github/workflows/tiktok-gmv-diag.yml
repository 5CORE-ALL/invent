name: TikTok GMV Max budget field check (temporary)

# TEMPORARY, test branch only. Prints field NAMES and the budget number of one campaign.
on:
  push:
    branches: [tiktok-gmv-test]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TT_TOKEN: ${{ secrets.TIKTOK_ADS_ACCESS_TOKEN }}
      TT_ADV: ${{ secrets.TIKTOK_ADS_ADVERTISER_ID }}
    steps:
      - name: Check info endpoint
        run: |
          set -uo pipefail
          TT_TOKEN=$(printf '%s' "$TT_TOKEN" | tr -d '[:space:]')
          TT_ADV=$(printf '%s' "$TT_ADV" | tr -d '[:space:]')
          B=https://business-api.tiktok.com/open_api/v1.3
          out=""
          for path in gmv_max/campaign/info; do
            http=$(curl -sS -m 40 -o i.json -w '%{http_code}' -G "$B/$path/" -H "Access-Token: $TT_TOKEN" \
              --data-urlencode "advertiser_id=$TT_ADV" --data-urlencode 'campaign_id=1882667097534897')
            out="$out || $path http=$http code=$(jq -r '.code // "?"' i.json) msg=$(jq -r '.message // ""' i.json | head -c 120)"
            out="$out data_keys=$(jq -r '(.data // {}) | keys | join("+")' i.json | head -c 400)"
            out="$out budget_like=$(jq -c '[(.data // {}) | to_entries[] | select(.key|test("budget";"i")) | {(.key): .value}] | add' i.json | head -c 200)"
          done
          echo "::notice title=budget check::$out"
