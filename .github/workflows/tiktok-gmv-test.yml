name: TikTok GMV Max connectivity test

# TEMPORARY test, runs only on the tiktok-gmv-test branch. Uses NO secrets and
# a dummy token: it only checks whether TikTok accepts requests from GitHub's
# runner IP (JSON auth error = reachable, 403 "banned country" = blocked).
on:
  push:
    branches: [tiktok-gmv-test]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe TikTok reachability (dummy token)
        run: |
          loc=$(curl -s -m 10 https://www.cloudflare.com/cdn-cgi/trace | grep '^loc=' | cut -d= -f2)
          out="runner_country=$loc"
          for host in business-api.tiktok.com ads.tiktok.com; do
            code=$(curl -s -m 30 -o /tmp/r.txt -w '%{http_code}' -G \
              "https://$host/open_api/v1.3/gmv_max/report/get/" \
              -H "Access-Token: dummy" \
              --data-urlencode "advertiser_id=1" \
              --data-urlencode 'store_ids=["1"]' \
              --data-urlencode 'dimensions=["item_id"]' \
              --data-urlencode 'metrics=["cost"]' \
              --data-urlencode "start_date=$(date -u -d '-7 day' +%F)" \
              --data-urlencode "end_date=$(date -u -d '-1 day' +%F)")
            body=$(head -c 140 /tmp/r.txt | tr '\n"' '  ')
            out="$out | $host http=$code body=$body"
          done
          echo "::notice title=TikTok reachability::$out"
