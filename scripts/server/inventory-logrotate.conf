# Install on the server (as root):
#   cp scripts/server/inventory-logrotate.conf /etc/logrotate.d/inventory-5core
# Keeps storage/logs from growing without limit (scheduler.log alone reached 3.1 GB, the folder 11 GB).
# copytruncate: the running PHP workers keep writing to the same open file.
/var/www/inventory_5c_usr/data/www/inventory.5coremanagement.com/storage/logs/*.log {
    daily
    rotate 3
    maxsize 200M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su inventory_5c_usr inventory_5c_usr
}
