; Install (as root), ONLY after scripts/server/queue-cleanup.sh --run has emptied the stale `default` queue:
;   cp scripts/server/supervisor-default-queue-worker.conf /etc/supervisor/conf.d/default-queue-worker.conf
;   supervisorctl reread && supervisorctl update
; Works the `default` queue (Meta Ads sync, cron-monitor alert mails). Same style as marketplace-manager-worker.
[program:default-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/inventory_5c_usr/data/www/inventory.5coremanagement.com/artisan queue:work database --queue=default --sleep=3 --tries=3 --timeout=300 --max-time=3600
autostart=true
autorestart=true
user=inventory_5c_usr
numprocs=1
stopwaitsecs=300
