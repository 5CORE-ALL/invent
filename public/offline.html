<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#3f0e40">
    <title>Invent Chat — Offline</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #3f0e40; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
        h1 { font-size: 22px; margin: 0 0 8px; }
        p { color: #cfc3cf; margin: 0 0 18px; line-height: 1.45; }
        button { border: 0; border-radius: 8px; background: #007a5a; color: #fff; font-weight: 700; padding: 10px 16px; }
    </style>
</head>
<body>
    <div>
        <h1>Invent Chat</h1>
        <p>You're offline. Messages stay on this device until the connection returns. Nothing private is stored in the app cache.</p>
        <button type="button" onclick="location.href='/chat'">Try again</button>
    </div>
</body>
</html>
